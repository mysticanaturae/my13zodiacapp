<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>13-Zodiak Astrologija ✨</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="./manifest.json">
  <script src="main.js" defer></script>

  <script>
   if ('serviceWorker' in navigator) {
     navigator.serviceWorker.register('./sw.js')
       .then(reg => console.log("Service Worker registered"))
       .catch(err => console.log("Service Worker registration failed:", err));
   }
  </script>
</head>

<body>
  <div id="zodiacApp">
    <h1>✨ 13-ZODIAK ASTROLOGIJA ✨</h1>
    <p class="subtitle">Odkrij svojo resnično kozmično identiteto & energijski podpis duše</p>

    <div class="inputGroup">
      <input type="text" id="nameInput" placeholder="Ime" autocomplete="name" maxlength="80">
      <input type="date" id="dobInput" placeholder="Datum rojstva">
      <input type="time" id="timeInput" placeholder="Ura rojstva">
      <input type="text" id="placeInput" placeholder="Kraj in država rojstva" maxlength="120">
      <button id="btnCompute">Freemium Izračun</button>
      <button id="btnPremium">✨ Premium Napoved</button>
    </div>

    <div id="statusText"></div>
    <div id="snapshotBox"></div>
    <div id="signsRepeater"></div>
  </div>

</body>
</html>
